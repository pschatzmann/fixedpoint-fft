sentence=Fast, in-place FFT for int8_t/int16_t/int32_t/float/double data, built around fixed-point integer math.
paragraph=Radix-2 FFT/IFFT with a configurable calculation type (int8_t/int16_t/int32_t/float/double, int8_t by default for speed and minimal RAM), an in-place two-array layout, offline-generated flash-resident twiddle tables, and no calls to sin()/cos() anywhere at runtime.
